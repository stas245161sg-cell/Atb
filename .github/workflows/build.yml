name: Build ApexGrid APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare project directory
        id: prep
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip archive: $ZIP_FILE"
            mkdir -p extracted_project
            unzip -q "$ZIP_FILE" -d extracted_project
            TOP_DIRS=$(find extracted_project -mindepth 1 -maxdepth 1 -type d | wc -l)
            TOP_FILES=$(find extracted_project -mindepth 1 -maxdepth 1 -type f | wc -l)
            if [ "$TOP_DIRS" -eq 1 ] && [ "$TOP_FILES" -eq 0 ]; then
              CANDIDATE=$(find extracted_project -mindepth 1 -maxdepth 1 -type d | head -n 1)
              if [ -f "$CANDIDATE/settings.gradle" ] || [ -f "$CANDIDATE/settings.gradle.kts" ]; then
                echo "Detected wrapper folder: $CANDIDATE"
                echo "PROJECT_DIR=$CANDIDATE" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "PROJECT_DIR=extracted_project" >> "$GITHUB_OUTPUT"
          else
            echo "ZIP archive not found - building checked-out sources from repository root."
            echo "PROJECT_DIR=." >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          SDK_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_HOME=$SDK_HOME"
          ls -la "$SDK_HOME" | head -20
          if [ ! -d "$SDK_HOME/platforms/android-34" ]; then
            echo "Installing platforms;android-34"
            yes | "$SDK_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34"
          fi
          if [ ! -d "$SDK_HOME/build-tools/34.0.0" ]; then
            echo "Installing build-tools;34.0.0"
            yes | "$SDK_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;34.0.0"
          fi
          echo "Android SDK ready"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Make Gradle wrapper executable
        working-directory: ${{ steps.prep.outputs.PROJECT_DIR }}
        shell: bash
        run: chmod +x ./gradlew || true

      - name: Build debug APK
        working-directory: ${{ steps.prep.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApexGrid-Debug-APK
          path: ${{ steps.prep.outputs.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
